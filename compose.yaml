services:
  translator:
    build: .
    image: offline-translator:latest
    ports:
      - "127.0.0.1:1010:8080"
    environment:
      MODEL_ENDPOINT: http://host.docker.internal:11434/api/generate
      MODEL_NAME: translategemma:12b
      HOST: 0.0.0.0
      ALLOW_CONTAINER_BIND: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
